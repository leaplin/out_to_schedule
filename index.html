<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="apple-mobile-web-app-capable" content="yes">

            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #f5f5f5;
        }
        .container {
            width: 100%;
            margin: 0 auto;
            padding: 15px 10px;
            /* 容器最大宽度可选，防止大屏过宽 */
            max-width: 1600px;
        }
        h2 {
            font-size: 18px;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .upload-area {
            padding: 30px 15px;
            border: 2px dashed #ccc;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #fff;
        }
        .upload-area:hover, .upload-area:active {
            border-color: #4299e1;
            background-color: #f5f9ff;
        }
        .upload-area input {
            display: none;
        }
        #selectFileBtn {
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
        }
        .upload-tip {
            color: #666;
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.4;
            padding: 0 10px;
        }
        #fileInfo {
            margin-bottom: 15px;
            color: #4299e1;
            font-weight: 600;
            font-size: 14px;
            line-height: 1.4;
            padding: 10px;
            background-color: #fff;
            border-radius: 8px;
        }
        .sheet-selector {

            align-items: center;
            gap: 10px;
            background-color: #fff;
            padding: 12px 15px;
            border-radius: 8px;
        }
        .sheet-selector label {
            color: #333;
            font-weight: 500;
            font-size: 15px;
            white-space: nowrap;
        }
        .sheet-selector select {

            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            min-width: 0;

            font-size: 14px;

            background-size: 16px;
        }
        /* 核心：强制左右分栏容器 - Flex布局（不切换为上下） */
        .split-container {
            display: flex;
            gap: 10px; /* 左右两部分间距 */
            width: 100%;
            height: auto;
            min-height: 400px; /* 保证分栏最小高度，避免塌陷 */
            margin-bottom: 15px;
            /* 禁止flex换行，强制左右并排 */
            flex-wrap: nowrap;
            /* 移动端左右布局超出时，容器可横向滚动（可选，避免内容挤压） */
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        /* 左侧：表格区域 - 固定flex占比，保持左右等分（可自定义） */
        .left-column {
            flex: 1; /* 等分空间，可改为固定宽度如width: 500px; */
            min-width: 280px; /* 最小宽度，防止被挤压过窄 */
            background-color: #fff;
            border-radius: 8px;
            padding: 5px;
            overflow: hidden;
        }
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
            height: calc(100% - 10px);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            min-width: 2100px;
        }
        th, td {

            font-size: 13px;
            position: relative;
        }

            color: white;
            font-weight: 600;
            font-size: 14px;
            position: sticky;
            top: 0;
            z-index: 10;

            z-index: 30;
            background-color: #ffffff;

            z-index: 30;
        }

        }

            color: #ffffff;

        }
        tr:hover td:nth-child(2) {
            background-color: #eaf2ff;
        }
        tr:nth-child(even) {
            background-color: #f9fafb;
        }
        tr:hover {
            background-color: #f0f7ff;
        }

            z-index: 5;
        }

            z-index: 30;
        }

            background-color: #d9edf7;
            z-index: 35;
        }

        }

        .input-title {

            font-weight: 500;

<body>
    <div class="container">
        <h2>百利广场工程部当天排班生产工具</h2>
        <div class="upload-area" id="uploadArea">
            <button class="btn" id="selectFileBtn">选择排班表文件</button>
            <input type="file" id="fileInput" accept=".xlsx, .xls" />
            <p class="upload-tip">仅支持 .xlsx / .xls 格式</p>
        </div>
        <div id="fileInfo"></div>
        <div class="sheet-selector hidden" id="sheetSelector">
            <label for="sheetList">选择工作表：</label>
            <select id="sheetList"></select>
        </div>

        <!-- 核心：左右分栏DOM（保持不变，样式强制左右） -->
        <div class="split-container">
            <!-- 左侧：表格区域 -->
            <div class="left-column">
                <div class="table-container" id="tableContainer"></div>
            </div>

            <!-- 右侧：文本输入框区域 -->
            <div class="right-column">
                <button id="copyBtn">📋 一键复制排班表</button>
                <h3 class="input-title">文本输入区域</h3>
                <textarea id="textInput" placeholder="请输入文本内容...（可粘贴表格相关备注、提取的信息等）"></textarea>
                <p class="input-tip">支持多行输入，内容仅保存在本地</p>
            </div>
        </div>
    </div>

    <script>
		
        // DOM 元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const selectFileBtn = document.getElementById('selectFileBtn');
        const fileInfo = document.getElementById('fileInfo');
        const sheetSelector = document.getElementById('sheetSelector');
        const sheetList = document.getElementById('sheetList');
        const tableContainer = document.getElementById('tableContainer');
        const textInput = document.getElementById('textInput');
        
        // 全局存储工作簿数据
        let workbook = null;

        // 初始化事件
        selectFileBtn.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#4299e1';
            uploadArea.style.backgroundColor = '#f5f9ff';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#ccc';
            uploadArea.style.backgroundColor = 'transparent';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#ccc';
            uploadArea.style.backgroundColor = 'transparent';
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFile(fileInput.files[0]);
            }
        });
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });
        sheetList.addEventListener('change', () => {
            const selectedSheet = sheetList.value;
            renderSheet(selectedSheet);
			console.log("第389");
			console.log(sheetList.value);
													// getCellValueByRowCol(sheetList.value, 2, 3)
													
        });

        // 读取文件并解析工作簿
        function handleFile(file) {
            fileInfo.textContent = `当前解析文件：${file.name}（大小：${(file.size / 1024 / 1024).toFixed(2)} MB）`;
            const reader = new FileReader();
            reader.readAsBinaryString(file);
            reader.onload = (e) => {
                try {
                    const data = e.target.result;
                    workbook = XLSX.read(data, { type: 'binary' });
                    fillSheetList();
                    sheetSelector.classList.remove('hidden');
                    renderSheet(workbook.SheetNames[0]);
                } catch (err) {
                    fileInfo.textContent = `解析失败：${err.message}`;
                    fileInfo.style.color = '#e53e3e';
                    tableContainer.innerHTML = '';
                }
            };
            reader.onerror = () => {
                fileInfo.textContent = '文件读取失败，请重试';
                fileInfo.style.color = '#e53e3e';
            };
        }

        // 填充工作表下拉列表
        function fillSheetList() {
            sheetList.innerHTML = '';
            workbook.SheetNames.forEach(sheetName => {
                const option = document.createElement('option');
                option.value = sheetName;
                option.textContent = sheetName;
                sheetList.appendChild(option);
													// 		console.log("第425");
													// 		console.log(sheetList.value);
													
            });
								// 						getCellValueByRowCol(sheetList.value, 2, 3)
        }

        // 渲染指定工作表
        function renderSheet(sheetName) {
            const worksheet = workbook.Sheets[sheetName];
            const merges = worksheet['!merges'] || [];
            const range = XLSX.utils.decode_range(worksheet['!ref'] || 'A1:A1');
            const dataArr = Array.from({ length: range.e.r + 1 }, () => Array(range.e.c + 1).fill(''));
            Object.keys(worksheet).forEach(key => {
                if (/^[A-Z]+\d+$/.test(key)) {
                    const { r, c } = XLSX.utils.decode_cell(key);
                    dataArr[r][c] = worksheet[key].v || '';
                }
            });
            renderTableWithMerges(dataArr, merges);
			
			// 									console.log("第425");
			// 									console.log(sheetList.value);
												
			// 									getCellValueByRowCol(sheetList.value, 2, 3)
												outToTextInput();
        }

        // 渲染带合并单元格的表格
        function renderTableWithMerges(dataArr, merges) {
            if (!dataArr.length) {
                tableContainer.innerHTML = '<p style="padding: 15px; text-align: center; color: #666; font-size: 14px;">该工作表无数据</p>';
                return;
            }
            const mergedFlags = Array.from({ length: dataArr.length }, () => Array(dataArr[0].length).fill(false));
            let tableHtml = '<table><tbody>';
            
            dataArr.forEach((row, rowIndex) => {
                tableHtml += '<tr>';
                row.forEach((cell, colIndex) => {
                    if (mergedFlags[rowIndex][colIndex]) return;
                    let colSpan = 1, rowSpan = 1, isMerged = false;
                    merges.forEach(merge => {
                        const { s, e } = merge;
                        if (s.r === rowIndex && s.c === colIndex) {
                            colSpan = e.c - s.c + 1;
                            rowSpan = e.r - s.r + 1;
                            isMerged = true;
                            for (let r = s.r; r <= e.r; r++) {
                                for (let c = s.c; c <= e.c; c++) {
                                    if (r !== s.r || c !== s.c) mergedFlags[r][c] = true;
                                }
                            }
                        }
                    });
                    const cellClass = isMerged ? 'merged-cell' : '';
                    tableHtml += `<td class="${cellClass}" colspan="${colSpan}" rowspan="${rowSpan}">${cell}</td>`;
                });
                tableHtml += '</tr>';
            });
            tableHtml += '</tbody></table>';
            tableContainer.innerHTML = tableHtml;
        }
